services:

  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: db
      POSTGRES_PASSWORD: pass
      POSTGRES_USER: user
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-storage:/var/lib/postgresql
    networks:
      - dtek-scraper-network

volumes:
  postgres-storage:
    name: dtek-scraper-volume

networks:
  dtek-scraper-network:
    name: default-network
    driver: bridge
